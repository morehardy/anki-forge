# Experiments are archived at the fixed evidence commit; they are not a release gate.
name: Archived benchmark reproduction
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bef4aeb653fc875f216614e73d8a617be039b9cf
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.0'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.2'
      - run: python3 benchmarks/bench.py prepare --python python3.11
      - run: benchmarks/.venv/bin/python -m unittest discover -s benchmarks/tests -v
      - run: benchmarks/.venv/bin/python benchmarks/bench.py smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: archived-benchmark-smoke-evidence
          path: benchmarks/.work/runs/
