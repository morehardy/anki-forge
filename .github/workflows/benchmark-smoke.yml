name: benchmark-smoke

on:
  pull_request:
    paths:
      - 'benchmarks/**'
      - 'anki_forge/**'
      - 'contract_tools/**'
      - '.github/workflows/benchmark-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.0'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.2'
      - run: python3 benchmarks/bench.py prepare --python python3.11
      - run: benchmarks/.venv/bin/python -m unittest discover -s benchmarks/tests -v
      - run: benchmarks/.venv/bin/python benchmarks/bench.py smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-smoke-evidence
          path: benchmarks/.work/runs/
