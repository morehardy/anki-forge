name: contract-release

on:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Commit or tag of the previous contract bundle
        required: true
        type: string

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p contract_tools --all-targets -- -D warnings
      - run: cargo test -p contract_tools -v
      - run: bash ./scripts/check_contract_governance.sh
        env:
          CONTRACT_BASE_REF: ${{ inputs.baseline_ref }}
      - id: package
        run: |
          artifact_path="$(cargo run --quiet -p contract_tools -- package --manifest "$GITHUB_WORKSPACE/contracts/manifest.yaml" --out-dir dist)"
          echo "artifact_path=$artifact_path" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: contract-bundle
          path: ${{ steps.package.outputs.artifact_path }}
