name: python-native-trial

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [codex/python-sdk-parity]

permissions:
  contents: read

concurrency:
  group: python-native-trial-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: standalone source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
      - run: python -m pip install build==1.6.1 maturin==1.15.0 mypy==2.3.1
      - name: Populate dependency cache before the offline source build
        run: cargo fetch --locked
      - name: Build standalone source package
        run: python -m build --sdist --no-isolation --outdir target/python-native-sdist bindings/python
      - name: Rebuild offline outside the checkout and exercise the installed wheel
        run: python -c "from pathlib import Path; import subprocess, sys; source, = Path('target/python-native-sdist').glob('*.tar.gz'); subprocess.run([sys.executable, 'bindings/python/scripts/check_native_sdist.py', str(source)], check=True)"
      - uses: actions/upload-artifact@v4
        with:
          name: python-native-source
          path: target/python-native-sdist/*.tar.gz
          retention-days: 14
  wheel:
    name: native wheel (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            architecture: x64
            interpreter: /opt/python/cp311-cp311/bin/python
            manylinux: "2014"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            architecture: x64
            interpreter: python
            manylinux: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            architecture: x64
            interpreter: python
            manylinux: ""
          - os: macos-14
            target: aarch64-apple-darwin
            architecture: arm64
            interpreter: python
            manylinux: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: ${{ matrix.architecture }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
      - name: Build independent Rust producer
        run: cargo build -p anki_forge_python_native --example python_parity --locked
      - run: python -m pip install mypy==2.3.1
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          maturin-version: "1.15.0"
          rust-toolchain: "1.92.0"
          working-directory: bindings/python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out ../../target/python-native-wheels --interpreter ${{ matrix.interpreter }}
      - name: Install and exercise wheel on Python 3.11
        run: python -c "from pathlib import Path; import subprocess, sys; wheel, = Path('target/python-native-wheels').glob('*.whl'); observer = Path('target/debug/examples') / ('python_parity.exe' if sys.platform == 'win32' else 'python_parity'); subprocess.run([sys.executable, 'bindings/python/scripts/check_native_wheel.py', str(wheel), '--observer', str(observer)], check=True)"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.architecture }}
      - run: python -m pip install mypy==2.3.1
      - name: Install and exercise the same abi3 wheel on Python 3.12
        run: python -c "from pathlib import Path; import subprocess, sys; wheel, = Path('target/python-native-wheels').glob('*.whl'); observer = Path('target/debug/examples') / ('python_parity.exe' if sys.platform == 'win32' else 'python_parity'); subprocess.run([sys.executable, 'bindings/python/scripts/check_native_wheel.py', str(wheel), '--observer', str(observer)], check=True)"
      - uses: actions/upload-artifact@v4
        with:
          name: python-native-${{ matrix.target }}
          path: target/python-native-wheels/*.whl
          retention-days: 14
