name: rust-crate-rehearsal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
          components: rustfmt,clippy
      - run: bash scripts/check_rust_crate_quality.sh
      - run: bash scripts/check_rust_crate_package.sh
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: anki_forge
      - run: cargo publish --dry-run -p anki_forge --locked
      - run: |
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          cargo cyclonedx --manifest-path anki_forge/Cargo.toml --format json

  tier1:
    name: rehearsal-tier1 (${{ matrix.os }}, Rust ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel, macos-14]
        toolchain: [1.92.0, stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: cargo fetch --locked
      - shell: bash
        run: bash scripts/check_rust_crate_package.sh
