name: rust-crate-rehearsal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
          components: rustfmt,clippy
      - run: bash scripts/check_rust_crate_quality.sh
      - name: Validate simulated release tag
        run: |
          version="$(awk '/^version = / { gsub(/version = |"/, ""); print; exit }' anki_forge/Cargo.toml)"
          bash scripts/check_rust_release_metadata.sh "anki-forge-v$version"
      - run: bash scripts/check_rust_crate_package.sh
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources
      - name: Resolve compatible-release baseline
        id: baseline
        run: bash scripts/resolve_rust_semver_baseline.sh >> "$GITHUB_OUTPUT"
      - if: steps.baseline.outputs.required == 'true'
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: anki_forge
      - if: steps.baseline.outputs.required == 'false'
        run: echo "No crates.io SemVer baseline exists for initial release 0.1.0."
      - run: cargo publish --dry-run -p anki_forge --locked
      - run: |
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          cargo cyclonedx --manifest-path anki_forge/Cargo.toml --format json
      - name: Stage rehearsal candidate inputs
        run: |
          mkdir release-inputs
          cp target/package/anki_forge-*.crate release-inputs/
          cp anki_forge/bom.json release-inputs/
      - uses: actions/upload-artifact@v4
        with:
          name: rust-crate-rehearsal-inputs
          path: release-inputs/
          if-no-files-found: error

  tier1:
    name: rehearsal-tier1 (${{ matrix.os }}, Rust ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel, macos-14]
        toolchain: [1.92.0, stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: cargo fetch --locked
      - shell: bash
        run: bash scripts/check_rust_crate_package.sh

  evidence:
    needs: [candidate, tier1]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: rust-crate-rehearsal-inputs
          path: release-inputs
      - name: Create rehearsal release evidence after Tier 1 passes
        env:
          ANKI_FORGE_TIER1_VERIFIED: "1"
        run: |
          version="$(awk '/^version = / { gsub(/version = |"/, ""); print; exit }' anki_forge/Cargo.toml)"
          crate_path="$(find release-inputs -name 'anki_forge-*.crate' -print -quit)"
          bash scripts/create_rust_release_evidence.sh \
            "anki-forge-v$version" "$crate_path" release-inputs/bom.json release-evidence
      - uses: actions/upload-artifact@v4
        with:
          name: rust-crate-rehearsal-candidate
          path: release-evidence/
          if-no-files-found: error

  promotion-boundary:
    needs: evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rust-crate-rehearsal-candidate
          path: release-evidence
      - name: Stop before protected publication approval
        run: |
          test -f release-evidence/release-record.json
          test -f release-evidence/SHA256SUMS
          echo "Rehearsal complete; no OIDC token requested and nothing published."
