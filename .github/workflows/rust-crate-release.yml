name: rust-crate-release

on:
  push:
    tags:
      - "anki-forge-v*"

permissions:
  contents: write
  id-token: write

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
          components: rustfmt,clippy
      - name: Validate release identity
        run: bash scripts/check_rust_release_metadata.sh "$GITHUB_REF_NAME"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - run: cargo test -p anki_forge --doc --locked
      - run: RUSTDOCFLAGS="-D warnings" cargo doc -p anki_forge --all-features --no-deps --locked
      - run: bash scripts/check_embedded_contract_bundle.sh
      - run: bash scripts/check_rust_crate_payload.sh
      - run: bash scripts/check_rust_crate_package.sh
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: anki_forge
      - name: Build crate archive
        run: cargo package -p anki_forge --locked
      - name: Generate CycloneDX SBOM
        run: |
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          cargo cyclonedx --manifest-path anki_forge/Cargo.toml --format json
      - name: Create release evidence
        shell: bash
        run: |
          mkdir -p release-evidence
          crate_path="$(find target/package -maxdepth 1 -name 'anki_forge-*.crate' -print -quit)"
          sbom_path="anki_forge/bom.json"
          test -n "$crate_path"
          test -n "$sbom_path"
          cp "$crate_path" release-evidence/
          cp "$sbom_path" release-evidence/anki_forge.cdx.json
          sha256sum "$crate_path" > release-evidence/SHA256SUMS
          version="${GITHUB_REF_NAME#anki-forge-v}"
          bundle_version="$(sed -n 's/^const EMBEDDED_BUNDLE_VERSION: &str = "\([^"]*\)";/\1/p' anki_forge/src/runtime/embedded.rs)"
          checksum="$(cut -d ' ' -f1 release-evidence/SHA256SUMS)"
          jq -n \
            --arg tag "$GITHUB_REF_NAME" \
            --arg commit "$GITHUB_SHA" \
            --arg crate_version "$version" \
            --arg bundle_version "$bundle_version" \
            --arg package_sha256 "$checksum" \
            '{schema_version:"anki-forge-rust-release-v1",tag:$tag,commit:$commit,crate_version:$crate_version,bundle_version:$bundle_version,msrv:"1.92.0",stable_verified:true,tier1_platforms:["x86_64-unknown-linux-gnu","x86_64-pc-windows-msvc","x86_64-apple-darwin","aarch64-apple-darwin"],package_sha256:$package_sha256,sbom:"anki_forge.cdx.json"}' \
            > release-evidence/release-record.json
      - uses: actions/upload-artifact@v4
        with:
          name: rust-crate-candidate
          path: release-evidence/
          if-no-files-found: error

  publish:
    needs: candidate
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
      - uses: actions/download-artifact@v4
        with:
          name: rust-crate-candidate
          path: release-evidence
      - id: crates_io_auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish immutable crates.io version
        run: cargo publish -p anki_forge --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
      - name: Verify exact published version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#anki-forge-v}"
          consumer="$(mktemp -d)"
          cargo init --bin --name anki_forge_release_verify "$consumer"
          cargo add --manifest-path "$consumer/Cargo.toml" "anki_forge@=$version"
          cargo check --manifest-path "$consumer/Cargo.toml"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-evidence/*
