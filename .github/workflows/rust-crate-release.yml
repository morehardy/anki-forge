name: rust-crate-release

on:
  push:
    tags:
      - "anki-forge-v*"

permissions:
  contents: write
  id-token: write

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
          components: rustfmt,clippy
      - name: Run release quality gates
        run: bash scripts/check_rust_crate_quality.sh "$GITHUB_REF_NAME"
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: anki_forge
      - name: Build crate archive
        run: cargo package -p anki_forge --locked
      - name: Generate CycloneDX SBOM
        run: |
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          cargo cyclonedx --manifest-path anki_forge/Cargo.toml --format json
      - name: Create release evidence
        shell: bash
        run: |
          crate_path="$(find target/package -maxdepth 1 -name 'anki_forge-*.crate' -print -quit)"
          bash scripts/create_rust_release_evidence.sh \
            "$GITHUB_REF_NAME" "$crate_path" anki_forge/bom.json release-evidence
      - uses: actions/upload-artifact@v4
        with:
          name: rust-crate-candidate
          path: release-evidence/
          if-no-files-found: error

  tier1:
    name: release-tier1 (${{ matrix.os }}, Rust ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel, macos-14]
        toolchain: [1.92.0, stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: cargo fetch --locked
      - shell: bash
        run: bash scripts/check_rust_crate_package.sh

  publish:
    needs: [candidate, tier1]
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
      - uses: actions/download-artifact@v4
        with:
          name: rust-crate-candidate
          path: release-evidence
      - id: crates_io_auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish immutable crates.io version
        run: cargo publish -p anki_forge --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
      - name: Verify exact published version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#anki-forge-v}"
          consumer="$(mktemp -d)"
          cargo init --bin --name anki_forge_release_verify "$consumer"
          cargo add --manifest-path "$consumer/Cargo.toml" "anki_forge@=$version"
          cat > "$consumer/src/main.rs" <<'RS'
          use anki_forge::prelude::*;

          fn main() {
              assert!(!anki_forge::embedded_contract_version().is_empty());
              let apkg = std::env::temp_dir().join("anki-forge-release-verify.apkg");
              let mut deck = Deck::new("Release Verify");
              deck.basic()
                  .note("front", "back")
                  .stable_id("release:verify")
                  .add()
                  .expect("add release verification note");
              deck.write_apkg(&apkg)
                  .expect("build through embedded contracts")
                  .ensure_success()
                  .expect("successful published build");
              assert!(apkg.is_file());
              std::fs::remove_file(apkg).expect("remove release verification artifact");
          }
          RS
          cargo run --manifest-path "$consumer/Cargo.toml" --locked
          curl --fail --location --retry 12 --retry-delay 10 --retry-all-errors \
            "https://docs.rs/anki_forge/$version/anki_forge/"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-evidence/*
