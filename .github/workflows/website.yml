name: Website

on:
  pull_request:
    paths:
      - 'website/**'
      - 'skills/anki-forge/**'
      - 'anki_forge/**'
      - 'contract_tools/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'docs/**'
      - 'scripts/**'
      - 'contracts/**'
      - '.cargo/**'
      - 'rust-toolchain'
      - 'rust-toolchain.toml'
      - 'bindings/**'
      - 'README.md'
      - 'README.zh-CN.md'
      - '.github/workflows/website.yml'
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'skills/anki-forge/**'
      - 'anki_forge/**'
      - 'contract_tools/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'docs/**'
      - 'scripts/**'
      - 'contracts/**'
      - '.cargo/**'
      - 'rust-toolchain'
      - 'rust-toolchain.toml'
      - 'bindings/**'
      - 'README.md'
      - 'README.zh-CN.md'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

env:
  SITE_URL: ${{ vars.SITE_URL || 'https://ankiforge.dev' }}
  SITE_BASE: ${{ vars.SITE_BASE || '/' }}
  SITE_CUSTOM_DOMAIN: ${{ vars.SITE_CUSTOM_DOMAIN || 'ankiforge.dev' }}
  SITE_DEPLOYMENT: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'production' || 'preview' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.92.0'
      - uses: Swatinem/rust-cache@v2
      - name: Fetch locked dependencies for offline documentation consumers
        run: cargo fetch --locked --manifest-path ../Cargo.toml
      - run: npm ci
      - name: Select historic compatibility contracts from the immutable base
        env:
          SURFACE_BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: node scripts/trusted-surface.mjs "$SURFACE_BASE_REVISION" "$RUNNER_TEMP/anki-forge-historic-surface"
      - name: Install browser and Chinese social-image fonts
        timeout-minutes: 10
        run: bash scripts/setup-browser-ci.sh
      - run: npm run check:ai
      - run: node ../skills/anki-forge/scripts/verify_quickstart.mjs
      - run: npm test
      - run: npm run check:examples
      - run: npm run check
      - name: Verify project-prefix deployment
        env:
          SITE_URL: https://morehardy.github.io
          SITE_BASE: /anki-forge
          SITE_CUSTOM_DOMAIN: ''
          SITE_DEPLOYMENT: preview
        run: |
          npm run build
          npm run check:rebuild
          npm run verify:release
          npm run check:release
      - name: Verify root deployment and prepare the release artifact
        run: |
          npm run build
          npm run check:rebuild
          npm run verify:release
          npm run check:release
      - uses: actions/upload-artifact@v4
        with:
          name: website-verified-manifest
          path: website/dist/generated/site-manifest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-browser-evidence
          path: target/website-i18n-62/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-localization-evidence
          path: target/website-localization/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  python-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.92.0'
      - uses: Swatinem/rust-cache@v2
      - name: Follow the native source installation and run documented programs
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install maturin==1.15.0
          maturin develop --manifest-path bindings/python/native/Cargo.toml --locked
          python bindings/python/examples/docs_basic.py target/docs-python/basic
          python bindings/python/examples/docs_media.py target/docs-python/media
          python bindings/python/examples/native_workflow.py target/docs-python/workflow
          python bindings/python/tests/test_csv_recipe.py

  node-examples:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.92.0'
      - uses: Swatinem/rust-cache@v2
      - run: npm run setup
      - run: npm run build
      - run: npm run example:minimal
      - run: npm run test:installed

  public-recipe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.92.0'
      - name: Install public packages and verify the shared generation/update contract
        run: node website/scripts/verify-public-recipe.mjs all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-json-recipe-evidence
          path: target/geo-public-consumers/

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, python-examples, node-examples, public-recipe]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: website-verified-manifest
          path: website/verified
      - run: npm ci --prefix website
      - name: Independently verify the deployed production URLs and artifact identity
        run: node website/scripts/check-live-site.mjs website/verified/site-manifest.json
      - name: Verify live search and interactive capabilities
        timeout-minutes: 10
        env:
          BROWSER_SITE: https://ankiforge.dev
        run: |
          cd website
          bash scripts/setup-browser-ci.sh
          node --test --test-name-pattern='all built|card tabs|docs search' scripts/browser.test.mjs
