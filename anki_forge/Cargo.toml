[package]
name = "ankiforge"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
description = "A typed Rust toolkit for building and validating Anki decks"
license = "MIT"
repository = "https://github.com/morehardy/anki-forge"
homepage = "https://ankiforge.dev/"
documentation = "https://ankiforge.dev/docs/rust-guide/"
readme = "README.md"
keywords = ["anki", "flashcards", "apkg", "spaced-repetition"]
categories = ["api-bindings", "data-structures"]
include = [
    "build.rs",
    "src/**",
    "!**/.DS_Store",
    "assets/**",
    "examples/target_api_basic.rs",
    "examples/target_api_custom_notetype.rs",
    "examples/target_api_media.rs",
    "tests/packaged_contract_tests.rs",
    "PACKAGE_FILES.txt",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "!tests/fixtures/**",
]

[features]
default = []
# Repository-only seam for the unpublished contract tool and deep conformance
# tests. It is not part of the supported 0.2 consumer interface.
internal-tools = []

[dependencies]
anyhow = "1.0.103"
base64 = "0.22"
blake3 = "1"
crc32fast = "1"
flate2 = "1"
hex = "0.4"
html-escape = "0.2"
imagesize = "0.13"
mime = "0.3"
jsonschema = { version = "0.18.3", default-features = false }
prost = "0.13"
rand = "0.8.6"
rusqlite = { version = "0.32", features = ["bundled"] }
same-file = "1.0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9"
sha1 = "=0.11.0"
tempfile = "3"
tar = "0.4.45"
# Match Anki's locked comparison tables for deck-name uniqueness.
unicase = "=2.6.0"
unicode-normalization = "0.1"
url = "2.5.4"
zip = { version = "2.2.0", default-features = false, features = ["deflate"] }
zstd = "0.13"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
proptest = "1.6"

[lints]
workspace = true

[[example]]
name = "conformance_surface"
required-features = ["internal-tools"]

[[example]]
name = "minimal_flow"
required-features = ["internal-tools"]

[[example]]
name = "product_basic_flow"

[[example]]
name = "product_roundtrip_oracle_prepare"
required-features = ["internal-tools"]
