[package]
name = "anki_forge"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "A typed Rust toolkit for building and validating Anki decks"
license = "MIT"
repository = "https://github.com/morehardy/anki-forge"
homepage = "https://github.com/morehardy/anki-forge"
documentation = "https://docs.rs/anki_forge"
readme = "README.md"
keywords = ["anki", "flashcards", "apkg", "spaced-repetition"]
categories = ["api-bindings", "data-structures"]
include = [
    "build.rs",
    "src/**",
    "assets/**",
    "examples/target_api_basic.rs",
    "examples/target_api_custom_notetype.rs",
    "examples/target_api_media.rs",
    "tests/packaged_contract_tests.rs",
    "PACKAGE_FILES.txt",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

[dependencies]
anyhow = "1.0.103"
base64 = "0.22"
blake3 = "1"
flate2 = "1"
hex = "0.4"
html-escape = "0.2"
imagesize = "0.13"
jsonschema = { version = "0.18.3", default-features = false }
prost = "0.13"
rand = "0.8.6"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha1 = "0.10"
tempfile = "3"
tar = "0.4.45"
unicode-normalization = "0.1"
url = "2.5.4"
zip = { version = "2.2.0", default-features = false, features = ["deflate"] }
zstd = "0.13"

[dev-dependencies]
proptest = "1.6"

[lints]
workspace = true
