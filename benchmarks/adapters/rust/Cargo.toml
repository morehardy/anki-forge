[package]
name = "anki-forge-benchmark"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
publish = false

[workspace]

[features]
default = []
mimalloc = ["dep:mimalloc"]

[dependencies]
anki_forge = { path = "../../../anki_forge" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
html-escape = "=0.2.15"
mimalloc = { version = "=0.1.52", optional = true, default-features = false }
