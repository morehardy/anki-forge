[package]
name = "anki_forge_node_native"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
anyhow = "1"
tempfile = "3"
anki_forge = { path = "../../../anki_forge", version = "0.1.0", features = ["internal-tools"] }
napi = { version = "=3.12.2", default-features = false, features = ["napi8", "tokio_rt"] }
napi-derive = "=3.6.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
napi-build = "=2.4.1"

# N-API macros generate the FFI boundary; the application core still forbids unsafe.
[lints.rust]
unsafe_code = "deny"
