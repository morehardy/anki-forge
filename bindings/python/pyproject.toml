[project]
name = "anki-forge"
version = "0.2.0"
description = "Python Product API for anki-forge"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[project.urls]
Homepage = "https://ankiforge.dev/"
Documentation = "https://ankiforge.dev/docs/python-quickstart/"
Repository = "https://github.com/morehardy/anki-forge"
Issues = "https://github.com/morehardy/anki-forge/issues"

[build-system]
requires = ["maturin==1.15.0"]
build-backend = "anki_forge_build"
backend-path = ["."]

[tool.maturin]
manifest-path = "native/Cargo.toml"
python-source = "src"
module-name = "anki_forge._native"
python-packages = ["anki_forge"]
exclude = ["src/anki_forge/_runtime/**", "src/anki_forge_python/**"]
include = [{ path = "anki_forge_build.py", format = "sdist" }]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
strict_equality = true
