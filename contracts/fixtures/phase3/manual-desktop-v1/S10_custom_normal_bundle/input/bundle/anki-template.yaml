format_version: template-bundle-v2
note_type:
  key: desktop-custom-normal
  name: Desktop Custom Normal
  fields:
    - key: prompt
      name: Prompt
      required: true
    - key: sort_key
      name: Sort Key
      sort: true
    - key: extra
      name: Extra
  templates:
    - key: card
      name: Card
      front_file: front.html
      back_file: back.html
      browser_front_file: browser-front.html
      browser_back_file: browser-back.html
      target_deck: Anki Forge Manual::Custom Normal
      generation_rule:
        kind: all
        fields: [prompt]
css_file: style.css
assets:
  - path: assets/icon.svg
    export_as: manual-icon.svg
