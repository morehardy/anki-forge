format_version: template-bundle-v2
note_type:
  key: language-card
  name: Language Card
  fields:
    - key: prompt
      name: Prompt
      required: true
    - key: extra
      name: Extra
      sort: true
  templates:
    - key: card
      name: Card
      front_file: front.html
      back_file: back.html
      browser_front_file: browser-front.html
      browser_back_file: browser-back.html
      target_deck: Languages::Custom
      generation_rule:
        kind: all
        fields: [prompt]
css_file: style.css
assets:
  - path: assets/icon.svg
    export_as: icon.svg
