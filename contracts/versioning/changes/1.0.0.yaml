baseline_version: 0.6.3
bundle_version: 1.0.0
compatibility_class: behavior_changing_incompatible
summary: Replace native authoring, template bundles and update outcomes with explicit stable keys, owned media and verified package identity evidence.
migration_notes: Use the root Project/Note/NoteType/Media API, template-bundle-v2 and ankiforge-project-v1. Provide namespace and note keys explicitly, mark HTML explicitly, and build updates from original packages carrying ankiforge-identity-v1. Snapshot paths are Unicode strings or tagged native byte/code-unit arrays. Input schemas describe structural constraints; loaders retain UTF-8 byte-budget checks. Old Deck/prelude/identity recipes/lockfiles and legacy native product input are removed; no compatibility adapter is provided. The contract major version is independent of the Rust crate version.
