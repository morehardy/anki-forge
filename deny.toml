[graph]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Informational unmaintained notice issued 2026-10-12; no patched version.
    # Retain the existing YAML backend for the 0.3.1 compatibility release.
    # release-maintainers own the exception until 2026-11-12; the policy checker
    # enforces expiry and unsafe-libyaml 0.2.11 in Cargo.lock.
    "RUSTSEC-2024-0449",
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "CC0-1.0",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
exceptions = [
    # napi-sys loads the Node-API symbols through libloading. Its ISC copyright
    # and permission notice ships with the Node SDK and every platform package.
    { name = "libloading", version = "=0.9.0", allow = ["ISC"] },
    # PyO3's target detection build dependency uses Apache-2.0 with the LLVM
    # exception. Both texts are included in the Python SDK's third-party notices.
    { name = "target-lexicon", version = "=0.13.5", allow = ["Apache-2.0 WITH LLVM-exception"] },
    # Patched zstd releases use BSD-3-Clause; the full texts are included in
    # the generated Python and Node SDK third-party notices.
    { name = "zstd", version = "=0.14.3", allow = ["BSD-3-Clause"] },
    { name = "zstd-safe", version = "=8.2.0", allow = ["BSD-3-Clause"] },
    { name = "zstd-sys", version = "=2.1.2", allow = ["BSD-3-Clause"] },
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
deny = []
# Existing transitive version splits are explicitly reviewed. Any new split is
# release-blocking and requires its own reviewed entry.
skip = [
    { name = "getrandom", version = "0.2.15" },
    # zip 9 uses 0.4; tempfile, jobserver and proptest still require 0.3.
    { name = "getrandom", version = "0.3.4" },
    { name = "hashbrown", version = "0.14.5" },
    { name = "linux-raw-sys", version = "0.4.15" },
    # png still uses 0.8 while the updated flate2 Rust backend uses 0.9.
    { name = "miniz_oxide", version = "0.8.9" },
    # rusty-fork (proptest's dev-only process isolation) still needs quick-error 1;
    # image-webp uses the incompatible version 2 API for production decoding.
    { name = "quick-error", version = "1.2.3" },
    { name = "rustix", version = "0.38.44" },
    { name = "syn", version = "2.0.115" },
    { name = "windows-sys", version = "0.59.0" },
    { name = "zerocopy", version = "0.7.35" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
