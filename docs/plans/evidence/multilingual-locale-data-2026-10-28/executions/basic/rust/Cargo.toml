[package]
name = "locale_data_basic_task"
version = "0.0.0"
edition = "2021"
[workspace]
[[bin]]
name = "locale_data_basic_task"
path = "src/main.rs"
[dependencies]
anyhow = "1"
serde_json = "1"
tempfile = "3"
prost = "0.13"
rusqlite = { version = "0.32", features = ["bundled"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
zstd = "0.13"
ankiforge = "0.3.1"
